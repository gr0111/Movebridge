    id: "^interest-field$"
- tapOn: "^유연성·스트레칭$"
- assertVisible: "^유연성·스트레칭$"
- scrollUntilVisible:
    element:
      text: "내 조건에 맞는 운동 찾기"
    direction: DOWN
- tapOn: "내 조건에 맞는 운동 찾기"
- extendedWaitUntil:
    visible: "나의 조건으로 찾은 공개 자료"
