name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend / Test, typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.34.3
          package_json_file: Frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Run Node tests
        run: node --test src/data/*.test.mjs src/auth/*.test.mjs src/features/*/*.test.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build

  supabase:
    name: Supabase / Migrations and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.4.0
      - name: Start local Postgres and apply repository migrations
        run: supabase db start
      - name: Ensure all local migrations are applied
        run: supabase migration up --local
      - name: Run local pgTAP tests
        run: supabase test db --local
